server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App data (served from a mount OUTSIDE the web root via alias) must always
    # be fresh (the updater rewrites it).
    location /data/ {
        alias /srv/dawghaus-data/;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Tiny API: siren counter + watch-spot votes (see api/server.py). Resolved lazily via Docker's DNS so
    # nginx still boots if the api container is slow to come up.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Service worker must never be hard-cached or updates won't ship.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Shell assets (JS/CSS) and audio: tell browsers AND Cloudflare to
    # revalidate against the origin (ETag) so deploys ship instantly instead
    # of being pinned to Cloudflare's default 4h edge cache.
    location ~* \.(?:js|css|mp3|ogg|wav)$ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
