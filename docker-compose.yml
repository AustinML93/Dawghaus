services:
  web:
    image: nginx:alpine
    container_name: dawghaus-web
    restart: unless-stopped
    ports:
      - "1889:80"            # 1889 = UW's first-ever football game. Point the CF tunnel here.
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # Data is served via an nginx alias (see nginx.conf) from OUTSIDE the web
      # root, so we don't nest a mount inside the read-only ./web mount.
      - ./data:/srv/dawghaus-data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Tiny stateful API (siren counter, where-we-watching votes). nginx proxies /api/ -> here.
  api:
    image: python:3.12-alpine
    container_name: dawghaus-api
    restart: unless-stopped
    labels:
      # WUD (What's Up Docker) on OMV: python:3.12-alpine is a pinned base image,
      # not an app release — without this WUD flags "3.15-rc-windowsservercore" as an update.
      - wud.watch=false
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      - DATA_DIR=/data
    volumes:
      - ./api:/app:ro
      - ./data:/data

  updater:
    image: python:3.12-alpine
    container_name: dawghaus-updater
    restart: unless-stopped
    labels:
      # WUD (What's Up Docker) on OMV: python:3.12-alpine is a pinned base image,
      # not an app release — without this WUD flags "3.15-rc-windowsservercore" as an update.
      - wud.watch=false
    working_dir: /app
    command: ["python", "update.py"]
    environment:
      - UPDATE_INTERVAL=1800    # 30 min in-season; updater self-drops to LIVE_INTERVAL during games
      - LIVE_INTERVAL=120
      - DATA_DIR=/data
      # Liveness: ntfy on OMV (topic omv-alerts, same as Harbor/watchdog). Alert once
      # when the last good ESPN sync is older than STALE_ALERT_HOURS, once on recovery.
      - NTFY_URL=http://192.168.1.200:9020/omv-alerts
      - STALE_ALERT_HOURS=6
    volumes:
      - ./updater:/app:ro
      - ./data:/data            # shared with web (read-only there)
